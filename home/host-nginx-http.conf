server {
    listen 80;
    listen [::]:80;
    server_name first.sub2image.cc.cd chat.sub2image.cc.cd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Bootstrap HTTPS so Cloudflare's edge redirect can still reach the ACME webroot.
# This certificate is replaced immediately after the new SAN certificate is issued.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name first.sub2image.cc.cd chat.sub2image.cc.cd;

    ssl_certificate /etc/letsencrypt/live/sub2image.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub2image.cc.cd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
